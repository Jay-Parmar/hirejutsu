[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hirejutsu"
dynamic = ["version"]
description = "Daily job picks matched to your resume."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "rich>=13.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hirejutsu = "hirejutsu.cli:main"
hj = "hirejutsu.cli:main"

[tool.setuptools.dynamic]
version = { attr = "hirejutsu.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hirejutsu = ["data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
