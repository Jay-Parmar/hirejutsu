<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>$title</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #f6f8f7;
  --ink: #1d2b2f;
  --muted: #5d6d70;
  --rule: #d9e1df;
  --soft: #e3ece9;
  --accent: #2b6c62;
  --on-accent: #ffffff;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131a1c;
    --ink: #e1e8e6;
    --muted: #94a5a3;
    --rule: #29353a;
    --soft: #1e2a2b;
    --accent: #79c2b0;
    --on-accent: #0f1f1c;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

main {
  max-width: 44rem;
  margin: 0 auto;
  padding: 40px 16px 64px;
}

h1 {
  margin: 0;
  font: 600 1.75rem/1.2 var(--serif);
}

.intro {
  margin: 8px 0 0;
  color: var(--muted);
}

code {
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--soft);
  font: 0.875rem ui-monospace, "Cascadia Mono", Consolas, monospace;
}

.picks {
  margin: 32px 0 0;
  padding: 0;
  list-style: none;
}

.pick {
  display: grid;
  grid-template-columns: 3rem 1fr;
  padding: 24px 0;
  border-top: 1px solid var(--rule);
}

.rank {
  color: var(--muted);
  font: 1.75rem/1 var(--serif);
}

h2 {
  margin: 0;
  font-size: 1.125rem;
  line-height: 1.35;
}

h2 a {
  color: inherit;
  text-decoration: none;
}

h2 a:hover {
  text-decoration: underline;
}

h2 a:visited {
  color: var(--muted);
}

.company {
  margin: 2px 0 0;
}

.facts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.875rem;
}

.facts:empty,
.reasons:empty {
  display: none;
}

.remote {
  padding: 0 8px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--accent);
  font-weight: 600;
}

.score {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0 0;
  font-size: 0.875rem;
  font-variant-numeric: tabular-nums;
}

.bar {
  width: 6rem;
  height: 6px;
  border-radius: 3px;
  background: var(--soft);
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  background: var(--accent);
}

.reasons {
  margin: 8px 0 0;
  padding-left: 1.1rem;
  font-size: 0.875rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  margin: 16px 0 0;
}

.open {
  padding: 6px 18px;
  border-radius: 6px;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
  text-decoration: none;
}

.command {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

button {
  padding: 2px 10px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: none;
  color: var(--ink);
  font: inherit;
  font-size: 0.875rem;
  cursor: pointer;
}

a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 520px) {
  main {
    padding-top: 24px;
  }

  .pick {
    grid-template-columns: 2.25rem 1fr;
    padding: 20px 0;
  }

  .rank {
    font-size: 1.375rem;
  }
}
</style>
</head>
<body>
<main>
<h1>$heading</h1>
<p class="intro">$count for your resume. Apply on each job's site, then run <code>hirejutsu applied &lt;id&gt;</code> to mark it.</p>
<ol class="picks">
$picks
</ol>
</main>
<script>
for (const button of document.querySelectorAll("button[data-command]")) {
  button.addEventListener("click", async () => {
    await navigator.clipboard.writeText(button.dataset.command);
    button.textContent = "Copied";
    setTimeout(() => {
      button.textContent = "Copy";
    }, 1500);
  });
}
</script>
</body>
</html>
