<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voluntary Disclosures</title>
</head>
<body>
<!-- Voluntary Disclosures with the dropdown ids of older pages, and the box agreeing to the terms. -->
<div data-automation-id="ApplyFlowPage"><main><div data-automation-id="applyFlowPage">
<div aria-label="Application Progress"><ol data-automation-id="progressBar">
  <li data-automation-id="progressBarActiveStep"><label aria-live="polite">current step 5 of 6</label><label>Voluntary Disclosures</label></li>
  <li data-automation-id="progressBarInactiveStep"><label aria-live="polite">step 6 of 6</label><label>Review</label></li>
</ol></div>
<h2>Voluntary Disclosures</h2>
<div data-automation-id="voluntaryDisclosuresPage">

<div data-automation-id="formField-8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b">
  <label for="personalInfoUS--gender">Please select your gender.</label>
  <div><button aria-haspopup="listbox" type="button" value="" id="personalInfoUS--gender" data-automation-id="gender"
    data-options="Male|Female|I do not wish to answer">Select One</button><input type="text" value=""></div>
</div>

<div data-automation-id="formField-9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c">
  <label for="personalInfoUS--ethnicity">Please select the ethnicity which most accurately describes how you identify yourself.</label>
  <div><button aria-haspopup="listbox" type="button" value="" id="personalInfoUS--ethnicity" data-automation-id="ethnicityDropdown"
    data-options="Asian (Not Hispanic or Latino)|White (Not Hispanic or Latino)|I do not wish to answer">Select One</button><input type="text" value=""></div>
</div>

<div data-automation-id="formField-0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d">
  <label for="personalInfoUS--veteranStatus">Please select the veteran status which most accurately describes your status.</label>
  <div><button aria-haspopup="listbox" type="button" value="" id="personalInfoUS--veteranStatus" data-automation-id="veteranStatus"
    data-options="I am not a protected veteran|I identify as one or more of the classifications of protected veteran">Select One</button><input type="text" value=""></div>
</div>

<div data-automation-id="formField-acceptTermsAndAgreements">
  <label for="termsAndConditions--acceptTermsAndAgreements"><span>Yes, I have read and consent to the terms and conditions<abbr aria-hidden="true">*</abbr></span></label>
  <div><input id="termsAndConditions--acceptTermsAndAgreements" data-automation-id="agreementCheckbox" type="checkbox" aria-checked="false" aria-required="true"></div>
</div>

</div>
<div data-automation-id="pageFooter">
  <button data-automation-id="pageFooterBackButton">Back</button>
  <button data-automation-id="pageFooterNextButton">Save and Continue</button>
</div>
</div></main></div>
<script src="widgets.js"></script>
</body>
</html>
