<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Application Questions</title>
</head>
<body>
<!-- Application Questions as companies set them up. Their field boxes are named by generated ids. -->
<div data-automation-id="ApplyFlowPage"><main><div data-automation-id="applyFlowPage">
<div aria-label="Application Progress"><ol data-automation-id="progressBar">
  <li data-automation-id="progressBarActiveStep"><label aria-live="polite">current step 4 of 6</label><label>Application Questions</label></li>
  <li data-automation-id="progressBarInactiveStep"><label aria-live="polite">step 6 of 6</label><label>Review</label></li>
</ol></div>
<h2>Application Questions</h2>
<div>

<div data-automation-id="formField-3f2a9c1e5b7d4e6f8a0b1c2d3e4f5a6b">
  <label for="primaryQuestionnaire--3f2a9c1e"><span>Will you now or in the future require sponsorship for employment visa status?<abbr aria-hidden="true">*</abbr></span></label>
  <div><button aria-haspopup="listbox" type="button" value="" id="primaryQuestionnaire--3f2a9c1e" data-options="Yes|No">Select One</button><input type="text" value=""></div>
</div>

<div data-automation-id="formField-4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d">
  <label for="primaryQuestionnaire--4a3b2c1d"><span>What is your notice period?<abbr aria-hidden="true">*</abbr></span></label>
  <div><input type="text" id="primaryQuestionnaire--4a3b2c1d" aria-required="true" value=""></div>
</div>

<div data-automation-id="formField-5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e">
  <fieldset><legend><label id="relocate-label"><span>Are you willing to relocate to Pune?<abbr aria-hidden="true">*</abbr></span></label></legend>
    <div aria-labelledby="relocate-label" aria-required="true">
      <div><input id="relocate-yes" name="relocate" type="radio" value="true"><label for="relocate-yes">Yes</label></div>
      <div><input id="relocate-no" name="relocate" type="radio" value="false"><label for="relocate-no">No</label></div>
    </div>
  </fieldset>
</div>

<div data-automation-id="formField-6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f">
  <label for="primaryQuestionnaire--6c5d4e3f">Why do you want to work for Acme?</label>
  <div><textarea id="primaryQuestionnaire--6c5d4e3f" aria-required="false"></textarea></div>
</div>

<div data-automation-id="formField-7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a">
  <label for="primaryQuestionnaire--7d6e5f4a">I agree that Acme may contact me about relocating</label>
  <div><input id="primaryQuestionnaire--7d6e5f4a" type="checkbox" aria-checked="false"></div>
</div>

</div>
<div data-automation-id="pageFooter">
  <button data-automation-id="pageFooterBackButton">Back</button>
  <button data-automation-id="pageFooterNextButton">Save and Continue</button>
</div>
</div></main></div>
<script src="widgets.js"></script>
